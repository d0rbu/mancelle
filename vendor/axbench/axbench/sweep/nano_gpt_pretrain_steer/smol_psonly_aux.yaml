# PromptSteering-only rerun of c100_adv/smol/aux (config smollm3_local_aux.yaml @ 252e6cf67), copied from its
# run_manifest.json with inference.models reduced to [PromptSteering]: the original run loaded each concept's
# LoRA into the shared model, so PromptSteering for concept k>=1 ran with concept k-1's adapter active.
generate:
  dataset_category: instruction
  lm_model: openai/gpt-5.6-luna
  lm_use_cache: true
  num_of_examples: 144
  output_length: 128
  seed: 42
inference:
  intervene_on_prompt: true
  lm_model: openai/gpt-5.6-luna
  model_name: HuggingFaceTB/SmolLM3-3B
  model_revision: a07cc9a04f16550a088caea529712d1d335b0ac1
  models:
  - PromptSteering
  seed: 42
  steering_batch_size: 10
  steering_datasets:
  - AlpacaEval
  steering_factors:
  - 1.0
  steering_intervention_type: addition
  steering_layer: 28
  steering_layers:
  - 28
  steering_model_name: HuggingFaceTB/SmolLM3-3B
  steering_model_revision: a07cc9a04f16550a088caea529712d1d335b0ac1
  steering_num_of_examples: 10
  steering_output_length: 128
  temperature: 1.0
  use_bf16: true
train:
  component: res
  layer: 28
  model_name: HuggingFaceTB/SmolLM3-3B
  model_revision: a07cc9a04f16550a088caea529712d1d335b0ac1
  models:
    LoRA:
      batch_size: 6
      binarize_dataset: false
      exclude_bos: true
      gradient_accumulation_steps: 6
      lora_alpha: 32
      lora_components:
      - o_proj
      lora_layers:
      - 7
      - 14
      - 21
      - 28
      low_rank_dimension: 4
      lr: 0.0009
      n_epochs: 24
      train_on_negative: false
      weight_decay: 0.0
  output_length: 128
  seed: 42
  use_bf16: true
