# Local AxBench evaluation configuration for a baseline-plus-SelfConditioning
# (no SelfConditioningMasked, no encoder-decoder baseline analogs) comparison,
# e.g. Pythia or SmolLM3 compared against the project's own SelfConditioning
# encoder-decoder method alone. SelfConditioningMasked is deliberately
# excluded here -- its rank-based rewrite needs its own project-methods data
# regenerated and separately validated before it's judged again; see
# merge_baseline_selfcond_methods.py. See also ../../../VENDORED.md.
evaluate:
  models:
    - DiffMean
    - LinearProbe
    - PromptSteering
    - LoRA
    - SelfConditioning
  latent_evaluators: []
  steering_evaluators: [LMJudgeEvaluator]
  report_to: []
  rotation_freq: 1000
  data_dir: null
  dump_dir: null
  num_of_workers: 8
  lm_model: openai/gpt-5.6-luna
  run_winrate: false
  winrate_baseline: null
  wandb_entity: null
  wandb_name: null
  run_name: false
  winrate_split_ratio: null
  master_data_dir: null
  prompt_steering_data_dir: null
  overwrite_inference_dump_dir: null
  overwrite_evaluate_dump_dir: null
  steer_data_type: concept
  defense: null
