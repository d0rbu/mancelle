# Modified by nano-gpt-pretrain-steer: declare AxBench's Stanza dependency,
# bump transformers for SmolLM3 support, and drop pyreft (hard-pinned to an
# incompatible transformers version, unused by any active config), and use
# CUDA 12.8 PyTorch wheels for Blackwell-capable frozen workers.
# See VENDORED.md.
[project]
name = "axbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4.3",
    "datasets>=3.0.2",
    "einops>=0.8.0",
    "httpx>=0.27.2",
    "openai>=1.52.1",
    "pyvene>=0.1.8",
    "torch>=2.7.1",
    "transformers>=4.53.0",
    "wandb>=0.18.5",
    "scikit-learn>=1.5.2",
    "seaborn>=0.12.2",
    "stanza==1.14.0",
    "peft>=0.13.2",
    "jupyter>=1.1.1",
    "adjusttext>=1.3.0",
    "altair>=5.5.0",
    "umap-learn>=0.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
