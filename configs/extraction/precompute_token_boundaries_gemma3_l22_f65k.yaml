# Step 4/5 — nanochat token-boundary overlays for the gemma-3-4b-it l22
# f65k dataset. Writes tok/<tokenizer_checksum>/seg_boundaries/.
#
# Inherits precompute_token_boundaries_gemma3.yaml; pins explicit feature_dir
# + f65k (parent defaults sae_width=16k). resume=true to fill only missing
# overlay shards. data_dir=null → nanochat default parquet dir (370 shards
# present locally).
#
#   uv run python -m scripts.preprocess.precompute_token_boundaries \
#       --config-name precompute_token_boundaries_gemma3_l22_f65k

defaults:
  - precompute_token_boundaries_gemma3
  - _self_

feature_dir: out/data/features/s128/l22/a_res/p_max_pool/f65k/m_gemma-3-4b-it/base
sae_width: "65k"

resume: true
