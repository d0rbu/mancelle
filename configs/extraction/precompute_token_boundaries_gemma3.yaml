# Gemma 3 + gemma-scope-2 token-boundaries config. Inherits the v1
# precompute_token_boundaries.yaml; overrides only the Gemma-3 model
# coordinates. The v1 parent already defaults sae_width: "16k" (matches the
# extract_features_gemma3.yaml default), so no sae override is needed.
# See docs/pipelines/gemma-scope-2.md.

defaults:
  - precompute_token_boundaries
  - _self_

model: gemma-3-4b-it
layer: 22
