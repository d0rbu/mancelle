# Base model pretraining config
# Usage: python -m scripts.train.base_train
# Override: python -m scripts.train.base_train depth=12 device_batch_size=16

defaults:
  - _train_common
  - _self_

# Pretraining runtime
attn_impl: auto  # auto, fa4 (flex_attention: FLASH on Hopper+, Triton elsewhere), fa3, sdpa

# FP8 training
fp8: false
fp8_recipe: tensorwise

# Model architecture
depth: 26
aspect_ratio: 64  # numeric per-layer width ratio; resolved width rounds up to head_dim
head_dim: 128
window_pattern: "SSSL"

# Pretraining horizon/scaling targets
target_flops: -1.0
target_param_data_ratio: 8.25

# Pretraining optimizer and schedule
scalar_lr: 0.5
adam_beta1: 0.8
adam_beta2: 0.95
warmup_ratio: 0.0
warmdown_ratio: 0.5
final_lr_frac: 0.0

# Pretraining-only evaluation
core_metric_every: 2000
core_metric_max_per_task: 500
sample_every: 2000
