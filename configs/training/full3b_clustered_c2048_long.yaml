# Same model, data, optimizer, B16/world-32 geometry, and evaluation policy as
# full3b_clustered_c2048, with an explicit 500,000-update horizon.
defaults:
  - full3b_clustered_c2048
  - _self_

run: full3b_clustered_c2048_long
model_tag: full3b_clustered_c2048_long

# 500,000 complete 1,048,576-token global batches consume 524,288,000,000
# tokens. Keep the ratio consistent for tools that report the configured
# token-to-scaling-parameter horizon even though num_iterations is explicit.
num_iterations: 500000
target_param_data_ratio: 296.284338576844
