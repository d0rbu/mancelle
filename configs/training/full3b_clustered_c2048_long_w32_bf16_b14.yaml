# 250,000-update horizon; the run identity, one-rank-larger global batch, and
# node-local cache opt-in/budget differ from full3b_clustered_c2048_long_w31.
defaults:
  - full3b_clustered_c2048_long_w31
  - _self_

run: full3b_clustered_c2048_long_w32_bf16_b14
model_tag: full3b_clustered_c2048_long_w32_bf16_b14

# 32 ranks x 14 rows x 2,048 tokens x accumulation 2.
