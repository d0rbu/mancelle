# 4xH100 config for depth-12 baseline + next-segment feature prediction loss
# Usage: torchrun --nproc_per_node=4 -m scripts.train.conditional_encdec_train -- config_name=conditional_encdec_d12_fp_4xh100

defaults:
  - conditional_encdec_train
  - _self_

# WandB run name
run: encdec_d12_fp_4xh100

# Checkpoint directory tag (avoid collision with other d12 runs)
model_tag: d12_fp

# depth=12 gives 768 dim, 6 heads
depth: 12

# 1024 context length
max_seq_len: 1024

# Larger device batch (smaller model + shorter context)
device_batch_size: 32

# Dynamic compilation
compile_static: false

# BF16 training (no FP8)
fp8: false

# Training duration via data ratio (100x params)
num_iterations: -1
target_param_data_ratio: 100

# Use all 370 feature shards
max_train_shards: null

# Feature selection: geometric, mean=10, max=40, top-k percentile
feature_selection:
  distribution: geometric
  mean: 10.0
  std: 10.0
  min_k: 1
  max_k: 40
  mode: top_k_percentile
  delta_weights: null

# Negative feature sampling: geometric, mean=10, max=40
negative_selection:
  distribution: geometric
  mean: 10.0
  min_k: 0
  max_k: 40

# Checkpoints every 1000 steps
save_every: 1000

# Steering eval every 250 steps (with offload to avoid OOM on PRO 6000)
steering_eval_every: 250
offload_steering_eval_feature_model: true

# Feature delta conditioning disabled
feature_delta: null

# Next-segment feature prediction auxiliary loss (full weight)
feature_prediction:
  block: mlp
  head_layers: 0
  weight: 1.0
  layer: -1
  loss_mode: best_token
  loss_fn: bce
