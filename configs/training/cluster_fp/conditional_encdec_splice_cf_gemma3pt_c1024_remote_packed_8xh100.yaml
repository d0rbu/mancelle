# @package _global_
# Target-host preset for the eight-H100 remote-packed production run.
#
# This is the operational spelling of the existing remote-packed run. It keeps
# the inherited run/model_tag and every semantic model/data setting, while
# pinning the measured H100 launch geometry and enabling bounded CUDA staging.
defaults:
  - conditional_encdec_splice_cf_gemma3pt_c1024_remote_packed
  - _self_

# Exact production artifact root and eight-H100 BF16 geometry.
feature_dir: out/data/features/s128/l22/a_res/p_max_pool/f65k/m_gemma-3-4b-pt/base/context_independent/no_bos/splice/cut_frac0.15/seed42
device_batch_size: 16
total_batch_size: 524288
fp8: false
steering_eval_every: 0

remote_training:
  body_prefetch:
    lookahead_shards_per_rank: 2
  train_packed:
    cuda_staging:
      # Holds 211 canonical production batches (2,539,776 retained bytes
      # each), enough to cross the 128-batch rank-local shard stripe before
      # the consumer drains the current shard.
      host_queue_bytes: 536870912
      # Three reusable pinned slots bound the ready GPU queue.
      pinned_slots: 3
