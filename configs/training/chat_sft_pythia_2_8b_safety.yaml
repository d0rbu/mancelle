# Chained model-only local export; a new optimizer and dataset epoch per stage.
defaults:
  - chat_sft_pythia_2_8b
  - _self_
mixture: safety
sft_loss_mask: completion_only
max_seq_len: 2048
device_batch_size: 1
total_batch_size: 524288
num_iterations: ${oc.decode:${oc.env:NUM_ITERATIONS}}
eval_every: 150
save_every: 100
huggingface:
  model_id: ${oc.env:HF_PARENT_EXPORT}
  # The loader still requires a 40-hex revision. For a local path Transformers
  # ignores revision for file resolution; retain the parent's source revision.
  # The data manifest below also content-binds the complete local export.
  revision: ${oc.env:HF_PARENT_REVISION}
  restart_save_every: ${save_every}
