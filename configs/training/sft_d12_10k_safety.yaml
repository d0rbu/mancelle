# Safety SFT for d12_base_10k decoder-only model.
# Usage: torchrun --nproc_per_node=4 -m scripts.train.chat_sft -- config_name=sft_d12_10k_safety

defaults:
  - chat_sft
  - _self_

run: sft_d12_10k_safety

# Load d12_base_10k pretrained model
source: base
model_tag: d12_base_10k

# Safety mixture
mixture: safety

# 1000 optimizer steps. At total_batch_size=524288 / (device_batch_size=32 *
# max_seq_len=1024 * 4 GPUs) = grad_accum_steps=4, that's 4000 micro-batches.
num_iterations: 1000

# Match pretraining context length
max_seq_len: 1024
device_batch_size: 32
total_batch_size: 524288
