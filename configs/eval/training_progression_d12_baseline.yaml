# Full progression config for d12_baseline encoder-decoder.

defaults:
  - training_progression
  - _self_

mode: both

model_tag: d12_baseline
model_family: encoder_decoder

checkpoints_dir: null
checkpoint_root: conditional_encdec_checkpoints
checkpoint_prefix: "s128/dist_geometric/mean_10.0/std_10.0"

phases:
  - phase: pretrain
    subdir: ""
    steps:
      - 52000
      - 53000
      - 54000
      - 54600
  - phase: safety_sft
    subdir: "safety_sft_conditioned_checkpoints"
    steps:
      - 886
  - phase: capabilities_sft
    subdir: "safety_sft_conditioned_checkpoints/capabilities_sft_conditioned_checkpoints"
    steps:
      - 1106

conditioning:
  conditioned_configs:
    - name: "Safety delta-base"
      features_file: out/data/common_features/safety_sft/delta_base/dist_geometric/mean_10.0/std_10.0/min_1/max_40/neg_dist_geometric/mean_10.0/std_10.0/min_0/max_40/seed_42/r_mean_pct_incl_zeros/m0.5/features.yaml
    - name: "Capability delta-base"
      features_file: out/data/common_features/capabilities_sft/delta_base/dist_geometric/mean_10.0/std_10.0/min_1/max_40/neg_dist_geometric/mean_10.0/std_10.0/min_0/max_40/seed_42/r_mean_pct_incl_zeros/m0.5/features.yaml
  context_cache_dir: out/data/eval_context_features/d12_baseline_static_delta
  target_real_configs: null
  identity:
    model_id: gemma-2-2b
    sae_id: gemmascope-residual-l8-16k
    layer: 8
    pooling: max_pool
    feature_selection_hash: f3cf767903a4d8442dfc3331142dd2f8eeea240eed8eb82d10e77b7a60c5278b
  n_sae_features: 16384
  num_buckets: 2

evals: "core,chat,harmfulness"

num_seeds: 3
base_seed: 1234

max_per_task: 100
chat_max_problems: 100
chat_max_new_tokens: 512
harm_num_benign: 50
harm_num_harmful: 50
harm_max_new_tokens: 512

num_gpus: 1

results_file: out/progression/d12_baseline/results.json
fig_dir: fig/progression/d12_baseline
