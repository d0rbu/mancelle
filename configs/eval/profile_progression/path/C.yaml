# @package _global_
progression:
  model_family: encoder_decoder
  checkpoint_root: conditional_encdec_checkpoints
  checkpoint_prefix: "s128/dist_geometric/mean_10.0/std_10.0"
  model_tag: d12_baseline
  step: 54600
  phase: pretrain
  subdir: ""

  evals: "core,chat,harmfulness"
  num_seeds: 1
  base_seed: 1234

  max_per_task: 20
  # Batch 1 preserves pre-batching BF16 numerics and the active decoder backend.
  core_example_batch_size: 1
  chat_tasks: null
  chat_batch_size: 8
  chat_max_new_tokens: 512
  chat_temperature: 0.0
  chat_top_k: 50
  chat_num_samples: 1
  chat_max_problems: 20
  harm_temperature: 0.7
  harm_top_k: 50
  harm_max_new_tokens: 512
  harm_num_benign: 10
  harm_num_harmful: 10
  harm_judge_model: "openai/gpt-5.6-luna"

  device_type: ""
  dtype: "bfloat16"
  checkpoint_source: local
  checkpoints_dir: null
  cleanup_after_eval: false

  conditioning:
    # NOTE: keyed by spec.phase ("pretrain" for our single-checkpoint profile
    # config), NOT by the common-features subdirectory name. See
    # _raw_conditioned_configs_for_phase in scripts/train/training_progression.py.
    conditioned_configs:
      pretrain:
        - out/data/common_features/safety_sft/geometric_m10_min1_max40_d12_seed1234/pretrain_ref_local_l8_1shard/features.yaml
    context_cache_dir: out/data/eval_context_features/progression_profiling
    identity:
      model_id: gemma-2-2b
      sae_id: layer_8/width_16k/canonical
      layer: 8
      pooling: max_pool
      feature_selection_hash: null
