# AxBench-Base evaluation pipeline — root Hydra config.
#
# Composes three subconfig groups:
#
#   tiers/   — controls how many concepts to run (dev / standard / full)
#   stages/  — which pipeline stage(s) to execute (prepare / synth / ... / all)
#   methods/ — which intervention methods to enable
#
# Usage:
#   uv run python -m scripts.eval.axbench_base_eval \
#       feature_dir=out/data/features/s128/l8/a_res/p_max_pool/f16k/m_gemma-2-2b/base \
#       feature_statistics_path=out/data/features/s128/l8/a_res/p_max_pool/f16k/m_gemma-2-2b/base/feature_statistics.safetensors \
#       decoder_only.source=base decoder_only.model_tag=d12_base decoder_only.step=54600 \
#       encdec.source=encdec    encdec.model_tag=d12_baseline encdec.step=54600
#
# Override tier / stage / methods on the CLI:
#   uv run python -m scripts.eval.axbench_base_eval tiers=dev stages=all methods=all \
#       feature_dir=... feature_statistics_path=... decoder_only=... encdec=...

# _self_ comes FIRST so tier / stage / method group overrides land on
# top of whatever the root YAML says. This makes
#   tiers=dev     → max_concepts = 5 (from tiers/dev.yaml)
# work as expected, instead of the root file shadowing the tier value.
defaults:
  - _self_
  - tiers: standard
  - stages: all
  - methods: all

# --- Mandatory fields (environment-specific, no sensible default) ---
# The user MUST override these on the command line. They are marked as
# `???` so Hydra/OmegaConf will raise on read if they are forgotten.

feature_dir: ???
feature_statistics_path: ???
decoder_only:
  source: ???
  model_tag: ???
  step: ???
encdec:
  source: ???
  model_tag: ???
  step: ???
device: cuda
# null preserves the historical default:
# $NANOCHAT_BASE_DIR/eval/axbench_base (or repo-root nanochat_cache when unset).
# Set a non-empty path to relocate every AxBench-Base output beneath it.
output_root: null

# --- Defaulted / commonly-overridden fields ---
#
# Everything below is an explicit restatement of an AxBenchBaseConfig
# default — included so it shows up in `--cfg job` and can be overridden
# on the CLI without remembering the field name.
#
# Any field NOT listed here inherits its default from the dataclass (see
# steering/eval/axbench_base/config.py).

run_tag: null          # auto-generated by the CLI if null

concept_feature_mode: canonical  # 'canonical' | 'delta_ranked'
run_negative_mode: true          # run negative-mode partition sweep
validation_shards: [369]                      # locked-in decision #19
neuronpedia_source: 8-gemmascope-res-16k      # Neuronpedia SAE source / SAE identity string
neuronpedia_model_id: gemma-2-2b              # Neuronpedia API model id
feature_extraction_model_id: null             # optional local model id for SAE/model loading
extraction_tokenizer_id: google/gemma-2-2b    # tokenizer used for base-SAE extraction
extraction_max_tokens: 1024
extraction_threshold: 0.0  # raw SAE activation magnitude, NOT a percentile
verification_percentile_threshold: 0.7  # fraction; Stage 0c requires >70 points
accept_threshold: 0.3  # fraction; Stage 1b requires an inclusive +30-point delta
# Stage 0b exact-prefix production extraction. All three values are positive
# semantic artifact identity because shard/batch grouping can affect numerics.
seed_extraction_candidate_shard_size: 1024
seed_extraction_gpu_batch_size: 16
seed_extraction_cpu_batch_size: 64
concept_examples_qc_target_surviving: null    # optional Stage 0c QC survivor cap
concept_description_fetch_limit: null         # optional Stage 0a Neuronpedia cap
concept_feature_whitelist_path: null  # optional path: accepted_feature_ids.txt OR manual_feature_filter.yaml
# Producer-side selection_splice_batch_size used by precompute_selected_features
# when it wrote this checkpoint's sel/<hash>/ overlay. Participates in the
# selection hash but is NOT recorded in checkpoint metadata, so a splice-trained
# checkpoint whose producer batched (> 1) must state it here or clustered
# manifest discovery finds nothing. null reproduces the unbatched identity.
selection_splice_batch_size: null
# Explicit sel/<hash>/manifest.json to pin, bypassing discovery. Needed when one
# feature root holds several packed-row splits (train / val / val-subset)
# sharing a selection hash; discovery finds all and refuses to guess.
selection_manifest_path: null
force_cluster_shard_revalidation: false
# ^ Stage 0a concept-candidate filtering: restricts candidate features BEFORE
#   Neuronpedia fetch. Distinct from the downstream conditioning.feature_mask.
#   Every ID must exist in feature statistics; absent IDs fail before API calls.
max_not_published_description_rate: 0.02       # Stage 0a fails loud if > this fraction of candidates 404 (source/SAE mismatch); 0.0 disables
max_missing_description_rate: 0.5              # ...or if > this fraction have no usable description at all (404 + 200-empty); catches an empty-returning mismatch; 0.0 disables
max_failed_description_rate: 0.5              # ...or if > this fraction could not be fetched for ANY reason (404 + empty + transient 5xx after retries); backstop for a nonexistent/typo'd source (5xx, not 404) or a rate-limit storm; 0.0 disables
min_source_mismatch_features: 5               # absolute floor for all three guards above: don't trip a small pool on a few legitimately-missing features or a brief network blip
verification_candidate_scan_limit: null       # optional Stage 0c scan cap
verification_candidate_attempt_limit: null    # optional Stage 0c verify cap
verification_zero_hit_bail_after: 2000        # Stage 0c bail when 0 verified after N attempts; null disables
verification_api_model: inclusionai/ling-2.6-flash  # default OpenRouter concept-rich generation + local SAE rejection; null = legacy local sampler
verification_api_prefix_wave_size: 100        # speculative prefixes per API wave; attempt/pool/zero-hit limits may reduce it
min_prefix_chars: 100                         # Stage 0c and Stage 1b prepared-prefix lower bound
max_prefix_chars: 2048                        # retain the most recent characters when a prefix is longer
n_positives_per_concept: 72                   # exact Stage 1b complete-pair target per concept
positive_max_attempts_per_seed: 8             # total semantic attempts, independently per rich/LLM-avoid side
positive_zero_hit_bail_after: 2000            # max distinct candidates while zero complete pairs; null disables
output_length: 64                             # extraction-tokenizer continuation length
positive_prefix_headroom_ceiling: 0.9         # fraction: with T=.3, admit seed_pct <= 60
max_retries: 100                              # Stage 0c/1c only: 101 proposals; Stage 1b uses positive_max_attempts_per_seed
qc_fallback_on_exhaust: error
max_concept_drop_fraction: 0.5                # exclude concept when logical-item drop fraction is > this
max_dropped_concept_fraction: 0.5             # fail stage when excluded-concept fraction is > this
synth:
  provider: openrouter
  model: inclusionai/ling-2.6-flash  # Stage 1 synth default; verification_api_model independently selects Stage 0c
  requests_per_minute: 6000      # per-process client admission ceiling
  max_concurrent: 100            # request ceiling; effective Stage 0c batch may be smaller
  transport_max_retries: 3       # 4 HTTP attempts total; exponential 1s, 2s, 4s backoff

# Stage 0c performance knobs (PR-2)
qc_batch_size: 16
qc_pipeline: true
verification_prefill_mode: shared            # "shared" | "repeated"
verification_cross_prefix_batch_size: 4      # 1 = serial prefixes; >1 batches K prefixes per verify chunk

# Context-feature cache for encoder-decoder Stage 4 generation. Build this from
# the exact Stage 3e manifest/parquet; Stage 4 requires its contexts fingerprint.
# Decoder-only
# target bundles ignore this block; encoder-decoder target bundles require it
# so every seed prefix receives real prompt/context SAE features. The cache
# must be built for the exact Stage 4 seed-prefix token sequences and the
# encoder-decoder model sequence length.
conditioning:
  context_cache_dir: null
  identity:
    model_id: gemma-2-2b
    sae_id: gemmascope-residual-l8-16k
    layer: 8
    pooling: max_pool
    # Must resolve to a 64-char hex hash; null is valid only when the full
    # canonical feature-selection pipeline params are present.
    feature_selection_hash: null
  n_sae_features: 16384
  num_buckets: 2
  feature_mask: null

layer_hooks:
  diffmean_and_probe_layer: 6

# Multi-GPU Stage 0c (PR-4): block size B. Each block spans B*world_size
# candidates; rank R takes B indices within the block before the all_gather
# rendezvous. Set higher (32-64) to reduce gather frequency on slower
# interconnects; lower (4-8) to surface a runaway rank earlier when
# iterating on the multi-GPU code.
stage0c_multi_gpu_block_size: 16

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
