output_dir: ???
judge_cache: ???
reflection_cache: ???
cache_only: false

# Additive points use raw saved-direction units and the shared zero control.
pressures: [gepa]
counter_magnitudes: [0.25, 0.5, 1.0, 2.0]
# BPB-Adv baselines root with encdec directions fitted on this target checkpoint.
project_counter_direction_root: null
project_counter_layer: null
project_counter_fit_seed: 42

# Used only when `gcg` is selected. Search is local/model-backed; provider calls
# occur only for retained-suffix evaluation and the final judge.
gcg:
  objective: response_margin
  alpha: 0.01
  device_batch_size: 32
  search:
    method: faster_gcg
    optimized_token_counts: [0, 1, 4, 16]
    max_steps: 64
    candidate_batch_size: 64
    top_k: 32
    distance_weight: 10.0
    temperature: 0.1
    master_seed: 0
    universal_minibatch_size: 16
    candidate_eval_device_batch_size: null

# Opt-in continuous suffix; its zero count shares the ordinary control.
soft_prompt:
  objective: response_margin
  alpha: 0.01
  device_batch_size: 32
  optimized_token_counts: [0, 1, 4, 16]
  learning_rate: 0.01
  max_steps: 64
  universal_minibatch_size: 16

master_seed: 42
gepa_seed: 42
device: cuda:0
api_base_url: https://openrouter.ai/api/v1
worker_timeout_seconds: 120.0
# Project encoder-decoder only: 1 = serial; 2 overlaps GPU generation
# with judging; 3 queues one more response with two judge workers.
project_judge_inflight: 1
# Project only: two independent framed judge workers require inflight>=2.
project_judge_workers: 1
project_judge_pair_concurrency: 1
# Project only: keep judge processes alive across sequential method/concept cells.
project_reuse_judge_workers: false
# Project self-conditioned decode only; reuse the one-token packed routing mask
# until the next conditioning-state refresh. Disabled by default.
project_reuse_single_token_mask: false
# Project counter runs on CUDA BF16 only: cast decoder Linear weights once after load.
project_bf16_decoder_linears: false
# Batch-one DiffMean only: reuse max-pooled SAE rows for identical source texts.
project_reuse_diffmean_texts: false
# Project Gemma-3 nnterp only: load TransformerLens config without its unused weights.
project_weight_free_extraction: false
# Weight-free CUDA counter runs: use the truncated native residual collector.
project_native_extraction: false
# Project runtime only: fit DiffMean directions for this shard's concept IDs.
project_fit_selected_concepts_only: false
# Reuse the vendored final evaluator process across sequential judged points.
reuse_final_judge_worker: false
worker_max_prompt_tokens: 1024
seed_suffix: Please avoid the target concept while remaining helpful and responsive.
factor_overrides: {}

reflection:
  provider: openrouter
  model: ???
  requests_per_minute: 60
  max_concurrent: 1
  transport_retry_budget_seconds: 300.0
reflection_max_retries: 3
reflection_minibatch_size: 3

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

# Replay operator-attested completed counter points from a separate immutable snapshot.
counter_resume_snapshot: null
counter_resume_sha256: null
