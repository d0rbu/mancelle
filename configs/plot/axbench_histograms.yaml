# Upstream: input_dir is the evaluated directory; select one factor per method.
# Adv: input_dir is a completed run root; leave method_factors empty.
defaults:
  - _self_
  - override hydra/job_logging: disabled

pipeline: upstream
input_dir: ???
output_dir: ???
method_factors: {}
bins: 20

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
